services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analytics
      # Password comes from project/.env (default keeps the historical value).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analytics}
      POSTGRES_DB: open_analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d open_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Keep in sync with POSTGRES_PASSWORD above (same interpolation).
      DATABASE_URL: postgresql+psycopg2://analytics:${POSTGRES_PASSWORD:-analytics}@postgres:5432/open_analytics
      APP_ENV: development
      DEBUG: "true"
      AI_PROVIDER: mock
      # No hardcoded secret: project/.env must define it (it already does).
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:?Set API_KEY_HASH_SECRET in project/.env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:8000
      # Optional dashboard password gate (V3); empty = disabled, as before.
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    depends_on:
      - backend
    volumes:
      - ./dashboard:/app/dashboard

volumes:
  pgdata:
