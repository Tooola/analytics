services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analytics
      # Required: no default password in the compose file — set it in
      # project/.env (copy .env.example first).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in project/.env (copy .env.example)}
      POSTGRES_DB: open_analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d open_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Keep in sync with POSTGRES_PASSWORD above (same interpolation).
      DATABASE_URL: postgresql+psycopg2://analytics:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in project/.env (copy .env.example)}@postgres:5432/open_analytics
      APP_ENV: development
      DEBUG: "true"
      AI_PROVIDER: mock
      # No hardcoded secret: project/.env must define it (it already does).
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:?Set API_KEY_HASH_SECRET in project/.env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
