services:
  - type: web
    name: open-analytics-ai-backend
    env: python
    rootDir: project/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: open-analytics-db
          property: connectionString
      - key: API_KEY_HASH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'

databases:
  - name: open-analytics-db
    databaseName: analytics
    user: analytics_user
    plan: free
