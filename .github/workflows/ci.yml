name: CI

on:
  push:
    branches: [main, T-ola]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            project/backend/requirements.txt
            project/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (report only, becomes blocking later)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check app

      - name: Run tests
        run: python -m pytest -q
